<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aloha Travel - 智慧旅遊助理</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* --- 核心高級配色 --- */
            --dark-forest: #1A3021;     /* 墨綠：主標題、按鈕 hover、深色頁尾 */
            --sage-green: #4A634E;      /* 鼠尾草綠：內文與次要文字 */
            --off-white: #F9FBF9;       /* 絲綢白：主背景 */
            --accent-gold: #B8977E;     /* 柔銅金：點綴線條、圖標、重要按鈕 */
            --accent-gold-light: #f3ece6;
            --border-color: #E2E8E2;    /* 質感邊框 */
            --glass-bg: rgba(249, 251, 249, 0.9);
            
            /* --- 標楷體字型家族 --- */
            --font-kai: "標楷體", "BiauKai", "DFKai-SB", "STKaiti", "Kaiti SC", serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--off-white);
            color: var(--dark-forest);
            font-family: var(--font-kai);
            line-height: 1.8;
            letter-spacing: 0.06em;
            overflow-x: hidden;
            min-height: 100vh;
            padding-bottom: 50px;
        }

        /* === 導覽列 Navbar === */
        .navbar {
            padding: 22px 6%;
            display: flex; 
            justify-content: space-between; 
            align-items: center;
            position: sticky; 
            top: 0; 
            z-index: 1000;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            transition: all 0.3s ease;
        }

        .navbar.scrolled {
            padding: 15px 6%;
            box-shadow: 0 4px 20px rgba(26, 48, 33, 0.06);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 0.15em;
            color: var(--dark-forest);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            color: var(--accent-gold);
            font-size: 1.3rem;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .logo:hover .logo-icon {
            transform: rotate(-12deg) scale(1.15);
        }

        .nav-center {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 22px;
        }

        .nav-links a {
            text-decoration: none; 
            color: var(--dark-forest);
            font-size: 0.95rem;
            transition: 0.3s; 
            position: relative;
            display: flex; 
            align-items: center; 
            gap: 6px;
            padding: 4px 0;
        }

        .nav-links a i {
            color: var(--sage-green);
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover i, .nav-links a.active i {
            color: var(--accent-gold);
        }

        .nav-links a::after {
            content: ''; 
            position: absolute; 
            bottom: 0; 
            left: 0;
            width: 0; 
            height: 1.5px; 
            background: var(--accent-gold);
            transition: width 0.3s ease;
        }

        .nav-links a:hover::after, .nav-links a.active::after { 
            width: 100%; 
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        /* 登入按鈕 */
        .btn-auth {
            background: transparent;
            border: 1px solid var(--dark-forest);
            color: var(--dark-forest);
            padding: 7px 22px;
            font-size: 0.9rem;
            font-family: var(--font-kai);
            cursor: pointer;
            border-radius: 30px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: 0.08em;
        }

        .btn-auth:hover {
            background: var(--dark-forest);
            color: var(--off-white);
            box-shadow: 0 4px 12px rgba(26, 48, 33, 0.15);
        }

        /* 使用者登入後頭像選單 */
        .user-profile-menu {
            position: relative;
            display: none; 
            align-items: center;
            gap: 10px;
            cursor: pointer;
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--dark-forest);
            color: var(--accent-gold);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border: 1.5px solid var(--accent-gold);
        }

        .user-name {
            font-size: 0.95rem;
            color: var(--dark-forest);
            font-weight: bold;
        }

        .user-dropdown {
            position: absolute;
            top: 48px;
            right: 0;
            background: var(--off-white);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 180px;
            padding: 8px 0;
            display: none;
            flex-direction: column;
            z-index: 1001;
        }

        .user-dropdown.active {
            display: flex;
            animation: fadeInDown 0.25s forwards;
        }

        .user-dropdown a, .user-dropdown button {
            padding: 10px 20px;
            color: var(--dark-forest);
            text-decoration: none;
            font-size: 0.9rem;
            font-family: var(--font-kai);
            background: none;
            border: none;
            text-align: left;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .user-dropdown a:hover, .user-dropdown button:hover {
            background: var(--accent-gold-light);
        }

        /* === 主視覺 Hero === */
        .hero {
            height: 62vh;
            min-height: 440px;
            display: flex; 
            align-items: center; 
            justify-content: center;
            text-align: center; 
            padding: 0 5%;
            background: linear-gradient(rgba(26, 48, 33, 0.65), rgba(26, 48, 33, 0.65)), 
                        url('https://images.unsplash.com/photo-1476514525535-07fb3b4ae5f1?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
            color: var(--off-white);
            position: relative;
            border-radius: 0 0 20px 20px;
            margin-bottom: 40px;
        }

        .hero-content {
            max-width: 850px;
            animation: fadeInUp 0.8s ease;
        }

        .hero-content h1 {
            font-size: clamp(2.2rem, 5vw, 3.6rem);
            font-weight: normal;
            letter-spacing: 0.25em;
            margin-bottom: 18px;
            text-shadow: 2px 2px 12px rgba(0,0,0,0.4);
        }

        .hero-content p {
            font-size: 1.1rem; 
            letter-spacing: 0.25em;
            opacity: 0.92;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        /* 搜尋列 */
        .search-wrap {
            max-width: 540px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.92);
            padding: 6px 8px;
            border-radius: 50px;
            display: flex;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            border: 1px solid rgba(184, 151, 126, 0.3);
        }

        .search-input {
            border: none;
            flex: 1;
            padding: 0 20px;
            outline: none;
            font-size: 1rem;
            font-family: var(--font-kai);
            background: transparent;
            color: var(--dark-forest);
        }

        .search-input::placeholder {
            color: #9ca3af;
        }

        .search-btn {
            background: var(--dark-forest);
            border: none;
            color: var(--off-white);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            cursor: pointer;
            transition: 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .search-btn:hover {
            background: var(--accent-gold);
            transform: scale(1.05);
        }

        /* === 統計數字欄位 === */
        .stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin: -60px auto 40px;
            position: relative;
            z-index: 10;
            padding: 0 5%;
        }

        .stat-card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-top: 2px solid var(--accent-gold);
            padding: 20px 35px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 10px 25px rgba(26, 48, 33, 0.05);
            width: 200px;
            transition: transform 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-4px);
        }

        .stat-num {
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--dark-forest);
            display: block;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--sage-green);
        }

        /* === 內容佈局 === */
        .container { 
            max-width: 1350px; 
            margin: 0 auto; 
            padding: 0 30px 60px; 
        }

        .grid-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 35px;
        }

        .card {
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-top: 2px solid var(--dark-forest);
            border-radius: 6px;
            padding: 30px;
            margin-bottom: 35px;
            box-shadow: 0 8px 25px rgba(26, 48, 33, 0.04);
            transition: 0.3s;
        }

        .card:hover {
            box-shadow: 0 12px 35px rgba(26, 48, 33, 0.07);
        }

        .card-header {
            padding-bottom: 18px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: normal;
            color: var(--dark-forest);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 0.1em;
        }

        .card-title i {
            color: var(--accent-gold);
        }

        .badge {
            background: rgba(184, 151, 126, 0.15);
            color: var(--dark-forest);
            padding: 4px 14px;
            border-radius: 20px;
            font-size: 0.82rem;
            font-weight: bold;
            border: 1px solid rgba(184, 151, 126, 0.3);
        }

        /* 清單卷軸區 */
        .list-wrap {
            max-height: 480px;
            overflow-y: auto;
            padding-right: 5px;
        }

        .list-wrap::-webkit-scrollbar {
            width: 5px;
        }

        .list-wrap::-webkit-scrollbar-track {
            background: var(--off-white);
        }

        .list-wrap::-webkit-scrollbar-thumb {
            background: var(--accent-gold);
            border-radius: 10px;
        }

        .list-item {
            padding: 18px 20px;
            border-bottom: 1px solid var(--border-color);
            cursor: pointer;
            transition: 0.25s;
            border-radius: 4px;
            margin-bottom: 10px;
            background: #fff;
        }

        .list-item:hover {
            background: var(--accent-gold-light);
            transform: translateX(3px);
        }

        .item-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: var(--dark-forest);
            font-size: 1.1rem;
            letter-spacing: 0.05em;
        }

        .item-meta {
            font-size: 0.85rem;
            color: var(--sage-green);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 8px;
        }

        .item-meta i {
            color: var(--accent-gold);
            margin-right: 4px;
        }

        .item-desc {
            font-size: 0.9rem;
            color: var(--sage-green);
            line-height: 1.6;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Tabs 分頁器 */
        .tabs {
            display: flex;
            gap: 10px;
            padding-bottom: 20px;
            overflow-x: auto;
        }

        .tab {
            padding: 6px 18px;
            border-radius: 20px;
            background: transparent;
            font-size: 0.9rem;
            font-family: var(--font-kai);
            cursor: pointer;
            white-space: nowrap;
            transition: 0.25s;
            color: var(--sage-green);
            border: 1px solid var(--border-color);
        }

        .tab.active, .tab:hover {
            background: var(--dark-forest);
            color: var(--off-white);
            border-color: var(--dark-forest);
            box-shadow: 0 4px 12px rgba(26, 48, 33, 0.12);
        }

        /* 排行榜項目 */
        .rank-item {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            margin-bottom: 10px;
            background: var(--off-white);
            border-radius: 6px;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .rank-item:hover {
            background: var(--accent-gold-light);
            border-color: var(--accent-gold);
        }

        .rank-num {
            font-weight: bold;
            width: 35px;
            text-align: center;
            font-size: 1.2rem;
            color: var(--accent-gold);
        }

        /* 文字雲 */
        .word-cloud {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            padding: 15px;
            justify-content: center;
            align-items: center;
            min-height: 180px;
            background: var(--off-white);
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }

        .cloud-word {
            padding: 6px 14px;
            background: #ffffff;
            border-radius: 20px;
            font-size: 0.88rem;
            color: var(--dark-forest);
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid var(--border-color);
        }

        .cloud-word:hover {
            transform: scale(1.08) translateY(-2px);
            background: var(--dark-forest) !important;
            color: var(--off-white) !important;
            border-color: var(--dark-forest);
        }

        /* === 登入/註冊 Modal === */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(26, 48, 33, 0.55);
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-container {
            background: var(--off-white);
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 440px;
            border-radius: 8px;
            padding: 35px 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            position: relative;
            transform: translateY(20px);
            transition: transform 0.3s ease;
        }

        .modal-overlay.active .modal-container {
            transform: translateY(0);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: none;
            border: none;
            font-size: 1.2rem;
            color: var(--sage-green);
            cursor: pointer;
            transition: 0.2s;
        }

        .modal-close:hover {
            color: var(--dark-forest);
        }

        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 25px;
        }

        .auth-tab {
            flex: 1;
            padding: 10px 0;
            text-align: center;
            background: none;
            border: none;
            font-family: var(--font-kai);
            font-size: 1.05rem;
            color: var(--sage-green);
            cursor: pointer;
            position: relative;
            transition: 0.3s;
        }

        .auth-tab.active {
            color: var(--dark-forest);
            font-weight: bold;
        }

        .auth-tab.active::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 100%;
            height: 2px;
            background: var(--accent-gold);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 0.9rem;
            color: var(--dark-forest);
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.input-icon {
            position: absolute;
            left: 14px;
            color: var(--sage-green);
            font-size: 0.9rem;
        }

        .form-control {
            width: 100%;
            padding: 11px 14px 11px 40px;
            background: #ffffff;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-family: var(--font-kai);
            font-size: 0.95rem;
            color: var(--dark-forest);
            outline: none;
            transition: 0.3s;
        }

        .form-control:focus {
            border-color: var(--dark-forest);
            box-shadow: 0 0 0 3px rgba(26, 48, 33, 0.06);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: var(--dark-forest);
            color: var(--off-white);
            border: none;
            border-radius: 4px;
            font-family: var(--font-kai);
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
            letter-spacing: 0.1em;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: var(--accent-gold);
            color: var(--dark-forest);
        }

        /* === 頁尾 === */
        .footer {
            background-color: var(--dark-forest);
            color: var(--off-white);
            padding: 50px 5% 40px;
            text-align: center; 
            font-size: 0.9rem;
            letter-spacing: 0.1em;
            margin-top: 60px;
        }

        .footer-logo {
            font-size: 1.3rem;
            margin-bottom: 12px;
            color: var(--accent-gold);
        }

        .footer-nav {
            margin: 20px 0;
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
        }

        .footer-nav a {
            color: var(--off-white);
            opacity: 0.8;
            text-decoration: none;
            transition: 0.3s;
            font-size: 0.88rem;
        }

        .footer-nav a:hover {
            opacity: 1;
            color: var(--accent-gold);
        }

        /* 響應式 */
        @media (max-width: 960px) {
            .grid-layout { grid-template-columns: 1fr; }
            .nav-links { display: none; }
            .hero-content h1 { font-size: 2.2rem; }
            .stats { flex-direction: column; align-items: center; gap: 15px; margin-top: -30px; }
            .stat-card { width: 100%; max-width: 320px; }
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

<body>

    <!-- 導覽列 Navbar -->
    <nav class="navbar" id="mainNavbar">
        <a href="#" class="logo">
            <i class="fas fa-paper-plane logo-icon"></i>
            <span>Aloha Travel</span>
        </a>

        <div class="nav-center">
            <div class="nav-links">
                <a href="index.html" class="active"><i class="fas fa-home"></i> 首頁 Home</a>
                <a href="航班.html"><i class="fas fa-plane"></i> 航班 Search</a>
                <a href="住宿.html"><i class="fas fa-hotel"></i> 住宿 Hotel</a>
                <a href="美食.html"><i class="fas fa-utensils"></i> 美食 Dining</a>
                <a href="保險.html"><i class="fas fa-shield-alt"></i> 保險 Insurance</a>
                <a href="chatbot.html"><i class="fas fa-robot"></i> AI 助手</a>
            </div>
        </div>

        <div class="nav-actions">
            <!-- 未登入狀態按鈕 -->
            <button class="btn-auth" id="openAuthBtn">
                <i class="far fa-user"></i>
                <span>登入 / 註冊</span>
            </button>

            <!-- 已登入狀態頭像 -->
            <div class="user-profile-menu" id="userProfileMenu">
                <div class="user-avatar" id="avatarInitial">旅</div>
                <span class="user-name" id="userNameDisplay">貴賓</span>
                <i class="fas fa-chevron-down" style="font-size: 0.75rem; color: var(--sage-green);"></i>

                <div class="user-dropdown" id="userDropdown">
                    <a href="#profile"><i class="far fa-id-card"></i> 個人行程資料</a>
                    <a href="#saved"><i class="far fa-bookmark"></i> 收藏景點清單</a>
                    <button id="logoutBtn"><i class="fas fa-sign-out-alt"></i> 登出帳號</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主視覺 Banner -->
    <header class="hero">
        <div class="hero-content">
            <h1>讓世界成為你的遊樂場</h1>
            <p>尋找完美旅伴，分享獨家攻略，即刻出發探索世界</p>
            <div class="search-wrap">
                <input type="text" class="search-input" placeholder="搜尋目的地、風格或旅伴...">
                <button class="search-btn"><i class="fas fa-search"></i></button>
            </div>
        </div>
    </header>

    <!-- 統計數據卡片 -->
    <div class="stats">
        <div class="stat-card">
            <span class="stat-num" id="statGuide">0</span>
            <span class="stat-label">精選旅遊攻略</span>
        </div>
        <div class="stat-card">
            <span class="stat-num" id="statCompanion">0</span>
            <span class="stat-label">尋找中的旅伴</span>
        </div>
    </div>

    <!-- 內容主體 -->
    <div class="container">
        <div class="grid-layout">
            <!-- 左側主要欄位 -->
            <div class="main-col">
                <!-- 最新旅遊攻略 -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="fas fa-map-marked-alt"></i> 最新旅遊攻略</div>
                        <span class="badge" id="badgeGuide">載入中</span>
                    </div>
                    <div class="list-wrap" id="guideList"></div>
                </div>

                <!-- 尋找旅行夥伴 -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="fas fa-user-friends"></i> 尋找旅行夥伴</div>
                        <span class="badge" id="badgeCompanion">載入中</span>
                    </div>
                    <div class="tabs" id="regionTabs">
                        <div class="tab active" data-region="all">全部</div>
                        <div class="tab" data-region="asia">亞洲</div>
                        <div class="tab" data-region="europe">歐洲</div>
                        <div class="tab" data-region="america">美洲</div>
                        <div class="tab" data-region="oceania">大洋洲</div>
                        <div class="tab" data-region="africa">非洲</div>
                    </div>
                    <div class="list-wrap" id="companionList"></div>
                </div>
            </div>

            <!-- 右側次要欄位 -->
            <div class="side-col">
                <!-- 熱門目的地 -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="fas fa-trophy"></i> 熱門目的地</div>
                    </div>
                    <div style="padding: 0 5px;" id="rankingList"></div>
                </div>

                <!-- 熱門標籤 / 文字雲 -->
                <div class="card">
                    <div class="card-header">
                        <div class="card-title"><i class="fas fa-hashtag"></i> 熱門標籤</div>
                    </div>
                    <div class="word-cloud" id="wordCloud"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 登入 / 註冊 Modal -->
    <div class="modal-overlay" id="authModal">
        <div class="modal-container">
            <button class="modal-close" id="closeAuthBtn"><i class="fas fa-times"></i></button>
            
            <div class="auth-tabs">
                <button class="auth-tab active" id="tabLogin">帳號登入</button>
                <button class="auth-tab" id="tabRegister">新用戶註冊</button>
            </div>

            <!-- 登入表單 -->
            <form id="loginForm" onsubmit="handleAuthSubmit(event, 'login')">
                <div class="form-group">
                    <label for="loginEmail">電子郵件 / 帳號</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope input-icon"></i>
                        <input type="email" id="loginEmail" class="form-control" placeholder="example@domain.com" required value="traveler@Aloha.com">
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword">密碼</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="loginPassword" class="form-control" placeholder="請輸入密碼" required value="password123">
                    </div>
                </div>

                <button type="submit" class="btn-submit">開啟我的旅程</button>
            </form>

            <!-- 註冊表單 -->
            <form id="registerForm" style="display: none;" onsubmit="handleAuthSubmit(event, 'register')">
                <div class="form-group">
                    <label for="regName">您的稱呼 / 暱稱</label>
                    <div class="input-wrapper">
                        <i class="far fa-user input-icon"></i>
                        <input type="text" id="regName" class="form-control" placeholder="例如：林漫旅" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regEmail">電子郵件</label>
                    <div class="input-wrapper">
                        <i class="far fa-envelope input-icon"></i>
                        <input type="email" id="regEmail" class="form-control" placeholder="example@domain.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="regPassword">設定密碼</label>
                    <div class="input-wrapper">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" id="regPassword" class="form-control" placeholder="至少8位數密碼" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit">註冊並登入</button>
            </form>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="footer">
        <div class="footer-logo">
            <i class="fas fa-paper-plane"></i> Aloha Travel
        </div>
        <div class="footer-nav">
            <a href="index.html">首頁</a>
            <a href="航班.html">航班搜尋</a>
            <a href="住宿.html">嚴選住宿</a>
            <a href="美食.html">在地美旬</a>
            <a href="旅遊.html">山海漫旅</a>
            <a href="保險.html">平安保障</a>
        </div>

    </footer>

    <!-- 資料引入檔案 -->
    <script src="./js/data.js"></script>
    <script src="./js/d.js"></script>
    <script src="./js/7.js"></script>
    <script src="./js/8.js"></script>

    <script>
        // 導覽列滾動陰影效果
        window.addEventListener('scroll', () => {
            const navbar = document.getElementById('mainNavbar');
            if (window.scrollY > 40) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        // 登入 Modal 控制
        const authModal = document.getElementById('authModal');
        const openAuthBtn = document.getElementById('openAuthBtn');
        const closeAuthBtn = document.getElementById('closeAuthBtn');
        const tabLogin = document.getElementById('tabLogin');
        const tabRegister = document.getElementById('tabRegister');
        const loginForm = document.getElementById('loginForm');
        const registerForm = document.getElementById('registerForm');

        openAuthBtn.addEventListener('click', () => authModal.classList.add('active'));
        closeAuthBtn.addEventListener('click', () => authModal.classList.remove('active'));
        authModal.addEventListener('click', (e) => { if (e.target === authModal) authModal.classList.remove('active'); });

        tabLogin.addEventListener('click', () => {
            tabLogin.classList.add('active');
            tabRegister.classList.remove('active');
            loginForm.style.display = 'block';
            registerForm.style.display = 'none';
        });

        tabRegister.addEventListener('click', () => {
            tabRegister.classList.add('active');
            tabLogin.classList.remove('active');
            loginForm.style.display = 'none';
            registerForm.style.display = 'block';
        });

        // 會員狀態管理
        const userProfileMenu = document.getElementById('userProfileMenu');
        const userNameDisplay = document.getElementById('userNameDisplay');
        const avatarInitial = document.getElementById('avatarInitial');
        const userDropdown = document.getElementById('userDropdown');
        const logoutBtn = document.getElementById('logoutBtn');

        function setLoggedInState(userName) {
            openAuthBtn.style.display = 'none';
            userProfileMenu.style.display = 'flex';
            userNameDisplay.textContent = userName;
            avatarInitial.textContent = userName.charAt(0);
            authModal.classList.remove('active');
            localStorage.setItem('aloha_user', userName);
        }

        function handleAuthSubmit(event, type) {
            event.preventDefault();
            let name = '尊榮貴賓';
            if (type === 'register') {
                const regNameInput = document.getElementById('regName').value;
                if (regNameInput) name = regNameInput;
            } else {
                const emailInput = document.getElementById('loginEmail').value;
                if (emailInput) name = emailInput.split('@')[0];
            }
            setLoggedInState(name);
        }

        userProfileMenu.addEventListener('click', (e) => {
            e.stopPropagation();
            userDropdown.classList.toggle('active');
        });

        document.addEventListener('click', () => userDropdown.classList.remove('active'));

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('aloha_user');
            userProfileMenu.style.display = 'none';
            openAuthBtn.style.display = 'flex';
        });

        // 檢查已登入狀態
        window.addEventListener('DOMContentLoaded', () => {
            const savedUser = localStorage.getItem('aloha_user');
            if (savedUser) {
                setLoggedInState(savedUser);
            }
            new App();
        });

        // Aloha Travel 核心 App 邏輯
        class App {
            constructor() {
                this.guideData = [];
                this.companionData = [];
                this.wordCloudData = [];
                this.topLocations = [];

                this.init();
            }

            init() {
                setTimeout(() => {
                    this.prepareData();
                    this.renderGuides();
                    this.renderCompanions('all');
                    this.renderRanking();
                    this.renderWordCloud();
                    this.updateStats();
                    this.setupTabs();
                    this.setupSearch();
                }, 100);
            }
            
            prepareData() {
                if (typeof realContentData !== 'undefined') this.guideData = realContentData;
                if (typeof discussionData !== 'undefined') this.companionData = discussionData;
                if (typeof topLocations !== 'undefined') this.topLocations = topLocations;
                if (typeof hotKeywords !== 'undefined') {
                    this.wordCloudData = hotKeywords;
                } else {
                    this.wordCloudData = this.topLocations;
                }
            }

            renderGuides() {
                const container = document.getElementById('guideList');
                if (!this.guideData.length) {
                    container.innerHTML = '<div style="padding:20px; text-align:center; color:#888;">無旅遊攻略數據</div>';
                    return;
                }

                container.innerHTML = this.guideData.slice(0, 10).map(item => `
                    <div class="list-item" onclick="alert('跳轉至文章 ID: ${item.id || ''}')">
                        <div class="item-title">${item.title || '無標題'}</div>
                        <div class="item-meta">
                            <span><i class="fas fa-user"></i> ${item.author || '匿名'}</span>
                            <span><i class="fas fa-map-marker-alt"></i> ${item.company || item.position || item.location || '未知地點'}</span>
                            <span><i class="far fa-calendar"></i> ${item.posted || item.date || '近期'}</span>
                            <span><i class="fas fa-heart"></i> ${item.likes || 0}</span>
                        </div>
                        <div class="item-desc">${item.preview || item.desc || '無內容描述...'}</div>
                    </div>
                `).join('');
            }

            renderCompanions(filterRegion) {
                const container = document.getElementById('companionList');
                if (!this.companionData.length) {
                    container.innerHTML = '<div style="padding:20px; text-align:center; color:#888;">無旅伴數據</div>';
                    return;
                }

                const data = filterRegion === 'all' ? this.companionData : this.companionData.filter(c => c.region === filterRegion);
                container.innerHTML = data.length ? data.slice(0, 10).map(item => `
                    <div class="list-item" onclick="alert('查看旅伴需求: ${item.title || ''}')">
                        <div class="item-title">${item.title || '無標題'}</div>
                        <div class="item-meta">
                            <span><i class="far fa-calendar"></i> ${item.posted || item.date || '未知日期'}</span>
                            <span><i class="fas fa-users"></i> ${item.needed ? '缺' + item.needed : '人數不限'}</span>
                            <span><i class="fas fa-venus-mars"></i> ${item.gender || '不拘'}</span>
                        </div>
                        <div style="font-size:0.85rem; color:var(--sage-green); margin-top:5px; display:flex; gap:10px;">
                            <span style="background:rgba(74,99,78,0.1); padding:2px 10px; border-radius:12px;">${item.duration || '天數未定'}</span>
                            <span style="background:rgba(184,151,126,0.15); padding:2px 10px; border-radius:12px; color:var(--dark-forest)">${item.status || '徵集中'}</span>
                        </div>
                    </div>
                `).join('') : '<div style="padding:20px; text-align:center; color:#888;">此區域暫無資料</div>';
            }

            renderRanking() {
                const container = document.getElementById('rankingList');
                if (!this.topLocations || !this.topLocations.length) {
                    container.innerHTML = '<div style="padding:20px; text-align:center; color:#888;">無排行數據</div>';
                    return;
                }

                container.innerHTML = this.topLocations.slice(0, 10).map((item, i) => {
                    const name = item.name || item.text || item.destination || '未知地點';
                    const count = item.count || item.size || 0;
                    
                    return `
                    <div class="rank-item">
                        <div class="rank-num">${i + 1}</div>
                        <div style="flex:1; font-weight:bold; color:var(--dark-forest);">
                            ${name}
                        </div>
                        <div style="color:var(--sage-green); font-size:0.85rem; display:flex; align-items:center;">
                            <i class="fas fa-fire" style="color:var(--accent-gold); margin-right:4px;"></i> ${count}
                        </div>
                    </div>`;
                }).join('');
            }

            renderWordCloud() {
                const container = document.getElementById('wordCloud');
                if (!this.wordCloudData || !this.wordCloudData.length) {
                    container.innerHTML = '<div style="padding:20px; text-align:center; color:#888;">無標籤數據</div>';
                    return;
                }

                const processedData = this.wordCloudData.map(item => {
                    if (typeof item === 'string') return { text: item, count: 1 };
                    return { text: item.text || item.name || item.word || String(item), count: item.count || 1 };
                });

                container.innerHTML = processedData.slice(0, 15).map(word => `
                    <span class="cloud-word" data-word="${word.text}">
                        #${word.text}
                    </span>
                `).join('');

                container.querySelectorAll('.cloud-word').forEach(word => {
                    word.addEventListener('click', () => {
                        const term = word.dataset.word;
                        document.querySelector('.search-input').value = term;
                        this.performSearch(term);
                    });
                });
            }

            updateStats() {
                const elGuide = document.getElementById('statGuide');
                const elCompanion = document.getElementById('statCompanion');
                const elBadgeGuide = document.getElementById('badgeGuide');
                const elBadgeCompanion = document.getElementById('badgeCompanion');

                if(elGuide) elGuide.textContent = this.guideData.length;
                if(elCompanion) elCompanion.textContent = this.companionData.length;
                if(elBadgeGuide) elBadgeGuide.textContent = `${this.guideData.length} 篇`;
                if(elBadgeCompanion) elBadgeCompanion.textContent = `${this.companionData.length} 則`;
            }

            setupTabs() {
                document.querySelectorAll('#regionTabs .tab').forEach(tab => {
                    tab.addEventListener('click', () => {
                        document.querySelectorAll('#regionTabs .tab').forEach(t => t.classList.remove('active'));
                        tab.classList.add('active');
                        this.renderCompanions(tab.dataset.region);
                    });
                });
            }

            setupSearch() {
                const searchBtn = document.querySelector('.search-btn');
                const searchInput = document.querySelector('.search-input');
                const runSearch = () => this.performSearch(searchInput.value.trim());
                searchBtn.addEventListener('click', runSearch);
                searchInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') runSearch(); });
            }

            performSearch(term) {
                if (!term) {
                    this.renderGuides();
                    this.renderCompanions('all');
                    return;
                }
                const lowerTerm = term.toLowerCase();

                const filteredGuides = this.guideData.filter(item =>
                    (item.title && item.title.toLowerCase().includes(lowerTerm)) ||
                    (item.location && item.location.toLowerCase().includes(lowerTerm)) ||
                    (item.preview && item.preview.toLowerCase().includes(lowerTerm))
                );

                const filteredCompanions = this.companionData.filter(item =>
                    (item.title && item.title.toLowerCase().includes(lowerTerm)) ||
                    (item.destination && item.destination.toLowerCase().includes(lowerTerm))
                );

                document.getElementById('guideList').innerHTML = filteredGuides.length ? filteredGuides.map(item => `
                    <div class="list-item">
                        <div class="item-title">${item.title}</div>
                        <div class="item-meta"><span><i class="fas fa-map-marker-alt"></i> ${item.location || '探索中'}</span></div>
                    </div>`).join('') : '<div style="padding:20px; text-align:center; color:#888;">未找到相關攻略</div>';

                document.getElementById('companionList').innerHTML = filteredCompanions.length ? filteredCompanions.map(item => `
                    <div class="list-item">
                        <div class="item-title">${item.title}</div>
                        <div class="item-meta"><span><i class="fas fa-users"></i> ${item.needed ? '缺' + item.needed : '揪團中'}</span></div>
                    </div>`).join('') : '<div style="padding:20px; text-align:center; color:#888;">未找到相關旅伴</div>';
            }
        }
    </script>
</body>
</html>
